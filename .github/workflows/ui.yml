# The optional UI (ui/) has its own job: the core jobs never install its dependencies,
# and this one runs only when the UI or the core it imports changes.
name: ui

on:
  push:
    branches: [main]
    paths: ["ui/**", "src/**", "fixtures/**", "package.json", "package-lock.json", "tsconfig.json", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["ui/**", "src/**", "fixtures/**", "package.json", "package-lock.json", "tsconfig.json", ".github/workflows/ui.yml"]

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      # The UI imports the built core (dist/), so the core is installed and built first.
      - name: Build the core
        run: |
          npm ci
          npm run build
      - name: Install the UI
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      - name: Server and export tests
        working-directory: ui
        run: npm test
      - name: Browser smoke test
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
